# Render 部署配置（monorepo 两服务）
# 在 Render 连仓库后，勾选「Use render.yaml」即可一键建好下面两个服务
services:
  # 1) 网易云音乐 API
  - type: web
    name: netease-api
    rootDir: NeteaseCloudMusicApi
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"

  # 2) AI 歌单后端（自动引用上面的网易云 API 地址）
  - type: web
    name: ai-playlist-server
    rootDir: server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NETEASE_API_BASE
        fromService:
          type: web
          name: netease-api
          property: host
      - key: LLM_BASE_URL
        # 必须带 /v1，否则 DeepSeek 接口返回 404
        value: https://api.deepseek.com/v1
      - key: LLM_API_KEY          # 敏感：在 Render 控制台手动填
        sync: false
      - key: LLM_MODEL
        value: deepseek-chat
      - key: COOKIE_SECRET        # 敏感：用 openssl rand -hex 32 生成，在 Render 控制台手动填
        sync: false
      - key: CORS_ORIGIN          # 前端域名
        value: https://www.playlist-helper.com
