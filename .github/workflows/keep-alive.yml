name: Keep Render Services Alive

on:
  schedule:
    # 每 10 分钟 ping 一次（防止 15 分钟休眠）
    - cron: '*/10 * * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping 后端服务
        run: |
          echo "=== Ping ai-playlist-server ==="
          curl -f -s -o /dev/null -w "HTTP %{http_code} time=%{time_total}s\n" \
            --max-time 30 https://api.playlist-helper.com/health || echo "后端 ping 失败"
          
          echo "=== Ping 网易云 API 服务 ==="
          curl -f -s -o /dev/null -w "HTTP %{http_code} time=%{time_total}s\n" \
            --max-time 30 https://netease-api-x8t6.onrender.com/ || echo "API ping 失败"
          
          echo "✅ Keep-alive ping 完成"
